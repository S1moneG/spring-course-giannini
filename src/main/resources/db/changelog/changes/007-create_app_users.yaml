
databaseChangeLog:
  - changeSet:
      id: 007
      author: simoneg
      changes:
        - createTable:
            tableName: app_users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
                    defaultValue: true
        - addUniqueConstraint:
            tableName: app_users
            columnNames: username
            constraintName: uk_app_users_username
        - sql:
            sql: |
              ALTER TABLE app_users
              ADD CONSTRAINT chk_app_users_role
              CHECK (role IN ('USER', 'ADMIN'));