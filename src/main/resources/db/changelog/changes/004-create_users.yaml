
databaseChangeLog:
  - changeSet:
      id: 004
      author: simoneg
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: citta_residenza
                  type: VARCHAR(255)
              - column:
                  name: data_creazione
                  type: timestamp
              - column:
                  name: data_di_nascita
                  type: date
              - column:
                  name: paese_residenza
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(255)
              - column:
                  name: username
                  type: VARCHAR(255)