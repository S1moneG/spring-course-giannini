services:
  db:
    image: postgres:16
    container_name: spring-course-postgres
    environment:
      POSTGRES_DB: local_db_spring_course
      POSTGRES_USER: simoneg
      POSTGRES_PASSWORD: simoneg
    ports:
      - "5433:5432"
    volumes:
      - dati-local_db_spring_course:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simoneg -d local_db_spring_course"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-init:
    image: postgres:16
    container_name: spring-course-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: simoneg
      PGPASSWORD: simoneg
      PGDATABASE: local_db_spring_course
    volumes:
      - ./docker/postgres/init:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["psql -v ON_ERROR_STOP=1 -f /scripts/01-create-databases.sql"]
    restart: "no"

  mongodb:
    image: mongo:8.0
    container_name: spring-course-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - dati-mongodb:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - root
        - --password
        - root
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  dati-local_db_spring_course:
  dati-mongodb:
